@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1d14;--card:#12281c;--ink:#f1ead2;--mut:#a9ae98;--line:#2a4636;--g:#0b3a23;--red:#e0705f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.2px;margin:0}
header{background:linear-gradient(120deg,var(--g),var(--g2));color:var(--on);border-bottom:3px solid var(--gold)}
.crest{width:48px;height:56px;background:#fffdf6 var(--logo) 0 0/auto 56px no-repeat;border-radius:6px;border:2px solid var(--gold);flex:none}.biglogo{height:116px;max-width:100%;background:var(--logo) center/contain no-repeat;margin-bottom:12px}
.drop{border:2px dashed var(--gold);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;background:#c9a22710;margin-bottom:12px}.drop:hover{background:#c9a22722}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold))}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.hd{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:230px}.brand b{font:700 22px 'Cormorant Garamond',Georgia,serif;display:block;line-height:1.1}
.brand small{color:var(--gold2);letter-spacing:3px;font-size:10px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{color:var(--on);text-decoration:none;padding:7px 14px;border-radius:20px;font-weight:500}
nav a.on{background:var(--gold);color:#1b2b21}nav a:hover:not(.on){background:#ffffff22}
.who{font-size:13px;display:flex;gap:10px;align-items:center}.bell{background:var(--red);padding:2px 9px;border-radius:12px;font-weight:600}
main{max-width:1100px;margin:auto;padding:22px 18px 60px}
h2{font-size:30px;color:var(--g);margin-bottom:14px}@media(prefers-color-scheme:dark){h2{color:var(--gold2)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0f4d2e12}
.card h3{font-size:22px;color:var(--g);margin-bottom:10px;border-bottom:1px solid var(--gold);padding-bottom:6px}
@media(prefers-color-scheme:dark){.card h3{color:var(--gold2)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:14px 16px}
.stat b{font:700 34px 'Cormorant Garamond',Georgia,serif;color:var(--g);display:block;line-height:1}.stat span{color:var(--mut);font-size:13px}
@media(prefers-color-scheme:dark){.stat b{color:var(--gold2)}}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);padding:8px;border-bottom:2px solid var(--gold)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr.r:hover{background:#c9a22712}
.tw{overflow-x:auto}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--g);color:#fff;border:0;padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold);color:#1b2b21}.btn.out{background:none;color:var(--g);border:1px solid var(--g)}.btn.red{background:var(--red)}.btn.sm{padding:5px 11px;font-size:13px}
@media(prefers-color-scheme:dark){.btn.out{color:var(--gold2);border-color:var(--gold2)}.btn{background:var(--g2)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.tag{padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;background:#c9a22722;color:#7a5f08}.tag.bad{background:#a63a2b22;color:var(--red)}.tag.ok{background:#1a6b4222;color:var(--g2)}
.prof{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.ph{width:130px;height:150px;border-radius:8px;border:3px solid var(--gold);background:var(--line) center/cover;display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center}
.alert{background:#a63a2b18;border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:8px;margin-bottom:10px;font-weight:500}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#md.on{display:flex}
#md>div{background:var(--card);border-radius:12px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border-top:5px solid var(--gold)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:60}
.login{max-width:400px;margin:50px auto;text-align:center}.login input{width:100%;margin-bottom:10px}.mut{color:var(--mut);font-size:13px}
a.lk{color:var(--g);font-weight:600;text-decoration:none}@media(prefers-color-scheme:dark){a.lk{color:var(--gold2)}}

const SUPABASE_URL='sb_publishable_bDwVxLgiKgER1-qxBjaM5Q_sQIfNveL',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzY2h0eW1uaXBsdmduc2ZvbnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NzUyNDMsImV4cCI6MjExMDQ1MTI0M30.wAWJsb_kfHfv07T4qOwBnW07KAA5UUgYxDk9XjrWIKY';

let SB=null;
const CL=["BS 1 Roses","BS 1 Zennias","BS 2 Lily","BS 2 Lilac","BS 3 Poppy","BS 3 Aster","BS 3 Magnolia","BS 4 Vicaria","BS 4 Ixora","BS 5 Dahlia","BS 5 Daisy","BS 6 Teasel","BS 6 Comfrey","BS 6 Lotus","BS 7 Hydrangea","BS 7 Cassia","BS 7 Begonia","BS 8 Jasmine","BS 8 Ivy","BS 9 Pansy"];
const K='slj_library_v1',FINE=2,LOAN_DAYS=14;let S,role=null,q='',cf='';
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{st:[],ln:[],at:[],as:[],cl:CL.slice(),u:{admin:'admin123',monitor:'monitor123'}};S.gr=S.gr||[];S.ay=S.ay||'2026/2027';let LH='',AT='class',TM='Term 1';
let DB=null,REM={},W=Promise.resolve(),LOC=null,READY=false,LD={};
const J=v=>JSON.stringify(v,(k,x)=>x&&typeof x=='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort()):x);
function chunks(){const o={'meta/main':{cl:S.cl,ay:S.ay}},by={};
S.st.forEach(s=>{const k='cls/'+s.cls.replace(/[^\w-]/g,'_');(o[k]=o[k]||{st:[]}).st.push({...s,photo:''});if(s.photo)o['ph/'+s.id]={p:s.photo}});
['ln','at','as','gr'].forEach(c=>S[c].forEach(r=>{const b=by[r.sid]=by[r.sid]||{ln:[],at:[],as:[],gr:[]};b[c].push(r)}));
for(const i in by)o['rec/'+i]=by[i];return o}
function build(){const n={st:[],ln:[],at:[],as:[],gr:[],cl:S.cl,ay:S.ay,u:S.u};
for(const p in REM){const d=REM[p];if(p=='meta/main'){n.cl=d.cl||n.cl;n.ay=d.ay||n.ay}else if(p.startsWith('cls/'))n.st.push(...d.st);else if(p.startsWith('rec/'))['ln','at','as','gr'].forEach(c=>n[c].push(...(d[c]||[])))}
for(const p in REM)if(p.startsWith('ph/')){const t=n.st.find(x=>x.id==p.slice(3));if(t)t.photo=REM[p].p}S=n}
function save(){if(!DB){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full. Remove some photos or export a backup.')}return}
if(!READY)return toast('Still connecting to the shared database. Try again in a moment.');
W=W.then(async()=>{const c=chunks(),ops=[];for(const p in c){if(J(REM[p])!==J(c[p])){REM[p]=JSON.parse(J(c[p]));ops.push(()=>DB.doc(p).set(c[p]))}}
for(const p in REM)if(!(p in c)){delete REM[p];ops.push(()=>DB.doc(p).delete())}
for(const f of ops){try{await f()}catch(e){toast('Could not save ('+(e.message||'error')+'). Monitor accounts have view-only access.')}}})}
const busy=()=>$('#md').classList.contains('on')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
function soft(){if(busy())return setTimeout(soft,3000);R()}
async function start(){const{data:{session}}=await SB.auth.getSession();if(!session)return login();const r=session.user.app_metadata&&session.user.app_metadata.role;
role=r=='admin'?'admin':r=='monitor'?'monitor':null;if(!role){await SB.auth.signOut();return login('This account has not been given a role yet. Ask the administrator.')}
DB={doc:p=>({set:async d=>{const{error}=await SB.from('docs').upsert({path:p,data:d});if(error)throw error},delete:async()=>{const{error}=await SB.from('docs').delete().eq('path',p);if(error)throw error}})};
S={st:[],ln:[],at:[],as:[],gr:[],cl:CL.slice(),ay:'2026/2027',u:{}};$('#app').innerHTML='<p class="mut" style="padding:40px;text-align:center">Loading records from the school database…</p>';
for(let f=0;;f+=1000){const{data,error}=await SB.from('docs').select('path,data').range(f,f+999);if(error){toast('Could not load records: '+error.message);return}data.forEach(x=>REM[x.path]=x.data);if(data.length<1000)break}
READY=true;build();
SB.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{if(pl.eventType=='DELETE'){delete REM[pl.old.path]}else{if(J(REM[pl.new.path])===J(pl.new.data))return;REM[pl.new.path]=pl.new.data}build();soft()}).subscribe();R()}
function boot(){if(!window.supabase||SUPABASE_URL.startsWith('PASTE')){$('#app').innerHTML='<div class="card"><h3>Setup needed</h3><p>Open <b>index.html</b>, paste your Supabase project URL and public key at the top, and publish again. The README explains each step.</p></div>';return}SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);start()}
function migrate(){if(!confirm('Copy the records saved in this browser into the shared database?'))return;S=JSON.parse(JSON.stringify(LOC));S.gr=S.gr||[];S.ay=S.ay||'2026/2027';LOC=null;save();R()}
const $=s=>document.querySelector(s),A=()=>role==='admin';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),add=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const late=l=>Math.max(0,diff(l.due,l.ret||today())),fine=l=>late(l)*FINE,bal=l=>fine(l)-(l.paid||0);
const money=n=>'GH₵ '+n.toFixed(2),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const stu=id=>S.st.find(s=>s.id==id),nm=id=>stu(id)?.name||'(removed)';
const open=l=>!l.ret,over=l=>open(l)&&late(l)>0;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function modal(h){$('#mdc').innerHTML=h;$('#md').classList.add('on')}function closeM(){$('#md').classList.remove('on')}
$('#md').addEventListener('click',e=>{if(e.target.id=='md')closeM()});
function clsOpts(sel,extra=''){return extra+S.cl.map(c=>`<option ${c==sel?'selected':''}>${esc(c)}</option>`).join('')}

function login(msg){$('#nav').innerHTML='';$('#who').innerHTML='';$('#app').innerHTML=`<div class="card login"><div class="biglogo" role="img" aria-label="St Louis Jubilee School"></div><h2>Library sign in</h2><p class="mut">Use the email and password given to you by the school administrator.</p>
<input id="lu" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
<button class="btn gold" style="width:100%" onclick="doLogin()">Sign in</button><p class="mut" id="le">${esc(msg||'')}</p></div>`}
async function doLogin(){const{error}=await SB.auth.signInWithPassword({email:$('#lu').value.trim(),password:$('#lp').value});if(error)$('#le').textContent='Wrong email or password. Check both and try again.';else start()}
async function logout(){await SB.auth.signOut();location.reload()}
function R(){if(DB&&!READY){$('#app').innerHTML='<p class="mut" style="padding:40px;text-align:center">Loading records from the school database…</p>';return}if(!role)return login();const h=location.hash.slice(1)||'dashboard';const od=S.ln.filter(over).length;
$('#nav').innerHTML=['dashboard','students','library','admin'].filter(x=>x!='admin'||A()).map(x=>`<a href="#${x}" class="${h.startsWith(x)||(x=='students'&&/^(student|assess)-/.test(h))?'on':''}">${x=='library'?'Borrowing':x[0].toUpperCase()+x.slice(1)}</a>`).join('');
$('#who').innerHTML=(od?`<span class="bell">${od} overdue</span>`:'')+`<span>${role=='admin'?'Administrator':'Monitor (view only)'}</span>${DB?'':'<button class="btn out sm" style="color:#fff;border-color:#fff8" onclick="logout()">Sign out</button>'}`;
const m=h.match(/^student-(.+)$/),m2=h.match(/^assess-(.+)$/);
$('#app').innerHTML=m2?assV(m2[1]):m?stuV(m[1]):({dashboard:dashV,students:listV,library:libV,admin:admV}[h]||dashV)();if(h!=LH){scrollTo(0,0);LH=h}}
addEventListener('hashchange',R);

function dashV(){const act=S.st.filter(s=>s.status=='active'),out=S.ln.filter(open),ov=S.ln.filter(over),owed=S.ln.reduce((t,l)=>t+bal(l),0),soon=out.filter(l=>late(l)==0&&diff(today(),l.due)<=2);
return `<h2>Welcome to the library desk</h2><div class="stats"><div class="stat"><b>${act.length}</b><span>Active students</span></div><div class="stat"><b>${out.length}</b><span>Books currently out</span></div><div class="stat"><b>${ov.length}</b><span>Overdue books</span></div><div class="stat"><b>${money(owed)}</b><span>Fines outstanding</span></div></div>
<div class="card"><h3>Due-date alerts</h3>${ov.map(l=>`<div class="alert">${esc(nm(l.sid))} · “${esc(l.title)}” is ${late(l)} day(s) overdue. Fine so far ${money(fine(l))}. <a class="lk" href="#student-${l.sid}">Open</a></div>`).join('')||'<p class="mut">No overdue books today.</p>'}
${soon.map(l=>`<p>⏳ ${esc(nm(l.sid))} · “${esc(l.title)}” due ${l.due}</p>`).join('')}</div>
${act.length?'':`<div class="card"><h3>Start here</h3><p>No students yet. ${A()?'Open <a class="lk" href="#admin">Admin</a>, choose a class, and paste a class list from the school PDF to import it.':'Ask the administrator to import the class lists.'}</p></div>`}`}

function rows(){const t=q.toLowerCase();return S.st.filter(s=>(cf=='_gone'?s.status!='active':s.status=='active'&&(!cf||s.cls==cf))&&(s.name.toLowerCase().includes(t)||s.ref.toLowerCase().includes(t))).map(s=>{const o=S.ln.filter(l=>l.sid==s.id&&over(l)).length;
return `<tr class="r"><td><a class="lk" href="#student-${s.id}">${esc(s.name)}</a></td><td>${esc(s.ref)}</td><td>${esc(s.status=='active'?s.cls:s.status)}</td><td>${esc(s.gender)}</td><td>${esc(s.contact)}</td><td>${o?'<span class="tag bad">overdue</span>':''}</td></tr>`}).join('')||'<tr><td colspan="6" class="mut">No students match. Try a different name, reference or class.</td></tr>'}
function listV(){return `<h2>Students</h2><div class="card"><div class="row"><label style="flex:1">Search<input id="sq" value="${esc(q)}" placeholder="Search by name or reference, e.g. SLJ24357" oninput="q=this.value;$('#tb').innerHTML=rows()"></label>
<label>Class<select onchange="cf=this.value;$('#tb').innerHTML=rows()"><option value="">All classes</option>${clsOpts(cf)}<option value="_gone" ${cf=='_gone'?'selected':''}>Left / graduated</option></select></label>${A()?'<button class="btn gold" onclick="addStu()">+ Add student</button>':''}</div>
<div class="tw"><table><thead><tr><th>Name</th><th>Reference</th><th>Class</th><th>Gender</th><th>Contact</th><th></th></tr></thead><tbody id="tb">${rows()}</tbody></table></div></div>`}

function addStu(){modal(`<h3>Add student</h3><div class="row"><label>Full name (Surname, Other names)<input id="n"></label><label>Reference<input id="r" placeholder="SLJ26200"></label><label>Gender<select id="g"><option>Male</option><option>Female</option></select></label><label>Contact<input id="c"></label><label>Class<select id="k">${clsOpts()}</select></label></div><button class="btn" onclick="saveStu()">Save student</button> <button class="btn out" onclick="closeM()">Cancel</button>`)}
function saveStu(){const n=$('#n').value.trim(),r=$('#r').value.trim().toUpperCase();if(!n||!r)return toast('Enter a name and a reference.');if(S.st.some(s=>s.ref==r))return toast('That reference already exists.');
S.st.push({id:uid(),name:n,ref:r,gender:$('#g').value,contact:$('#c').value.trim(),cls:$('#k').value,status:'active',photo:''});save();closeM();toast('Student added');R()}

function stuV(id){const s=stu(id);if(!s)return '<p>Student not found.</p>';const L=S.ln.filter(l=>l.sid==id).sort((a,b)=>b.out.localeCompare(a.out)),T=S.at.filter(a=>a.sid==id).sort((a,b)=>b.d.localeCompare(a.d)),AS=S.as.filter(a=>a.sid==id),owed=L.reduce((t,l)=>t+bal(l),0),td=T.find(a=>a.d==today()),cnt=k=>T.filter(a=>a.s==k).length,ed=A();
return `<p><a class="lk" href="#students">← All students</a></p><div class="card"><div class="prof"><div class="ph" style="${s.photo?`background-image:url(${s.photo})`:''}">${s.photo?'':'No photo'}</div>
<div style="flex:1;min-width:220px"><h2 style="margin-bottom:4px">${esc(s.name)}</h2><p class="mut">${esc(s.ref)} · ${esc(s.gender)} · ${esc(s.contact||'no contact')}</p><p><span class="tag ${s.status=='active'?'ok':''}">${s.status=='active'?esc(s.cls):s.status}</span> ${owed>0?`<span class="tag bad">Owes ${money(owed)}</span>`:'<span class="tag ok">No fines owed</span>'}</p>
<p><a class="btn sm" href="#assess-${id}" style="text-decoration:none;display:inline-block">Assessment &amp; performance</a></p>${ed?`<input type="file" id="pf" accept="image/*" hidden onchange="photo('${id}',this)"><button class="btn gold sm" onclick="$('#pf').click()">Upload picture</button> <button class="btn out sm" onclick="moveStu('${id}')">Change class / status</button>`:''}</div></div></div>
<div class="card"><h3>Attendance</h3><p>Today (${today()}): <b>${td?td.s:'not marked'}</b> · Present ${cnt('Present')} · Late ${cnt('Late')} · Absent ${cnt('Absent')}</p>
${ed?['Present','Late','Absent'].map(k=>`<button class="btn ${k=='Present'?'':'out'} sm" onclick="mark('${id}','${k}')">Mark ${k.toLowerCase()}</button>`).join(' '):''}
<p class="mut">Recent: ${T.slice(0,10).map(a=>`${a.d} ${a.s}`).join(' · ')||'no records yet'}</p></div>
<div class="card"><h3>Borrowing history</h3>${ed?`<div class="row"><label style="flex:1">Book title<input id="bt" placeholder="Title of the book being borrowed"></label><label>Date borrowed<input type="date" id="bo" value="${today()}"></label><label>Due date<input type="date" id="bd" value="${add(today(),LOAN_DAYS)}"></label><label>Condition now<select id="bc"><option>Good</option><option>New</option><option>Fair</option></select></label><button class="btn" onclick="borrow('${id}')">Record borrowing</button></div>`:''}
<div class="tw"><table><thead><tr><th>Book</th><th>Borrowed</th><th>Due</th><th>Returned / condition</th><th>Fine (GH₵2/day)</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(l.title)}<br><span class="mut">Out: ${esc(l.c0)}</span></td><td>${l.out}</td><td>${l.due}</td><td>${l.ret?`${l.ret}<br>${esc(l.cond)}${l.note?' – '+esc(l.note):''}`:over(l)?`<span class="tag bad">${late(l)} days overdue</span>`:'<span class="tag">Out</span>'}</td>
<td>${money(fine(l))}${l.paid?`<br><span class="mut">Paid ${money(l.paid)}</span>`:''}<br><b>${bal(l)>0?'Balance '+money(bal(l)):'Settled'}</b></td><td>${ed?`${open(l)?`<button class="btn sm" onclick="ret('${l.id}')">Return</button> `:''}${bal(l)>0?`<button class="btn gold sm" onclick="pay('${l.id}')">Record payment</button>`:''}`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No books borrowed yet.</td></tr>'}</tbody></table></div></div>
<div class="card"><h3>Assignments</h3>${ed?`<div class="row"><label style="flex:1">Assignment<input id="at" placeholder="Title or subject"></label><label>Due<input type="date" id="ad" value="${add(today(),7)}"></label><button class="btn" onclick="assign('${id}')">Add assignment</button></div>`:''}
${AS.map(a=>`<p>${a.done?'✅':'⬜'} ${esc(a.title)} <span class="mut">due ${a.due}</span> ${ed?`<button class="btn out sm" onclick="togA('${a.id}')">${a.done?'Reopen':'Mark done'}</button>`:''}</p>`).join('')||'<p class="mut">No assignments recorded.</p>'}</div>`}

function photo(id,inp){const f=inp.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas');c.width=200;c.height=230;const x=c.getContext('2d'),r=Math.max(200/im.width,230/im.height);x.drawImage(im,(200-im.width*r)/2,(230-im.height*r)/2,im.width*r,im.height*r);stu(id).photo=c.toDataURL('image/jpeg',.8);save();R()};im.src=u}
function mark(id,k){S.at=S.at.filter(a=>!(a.sid==id&&a.d==today()));S.at.push({sid:id,d:today(),s:k});save();R()}
function borrow(id){const t=$('#bt').value.trim();if(!t)return toast('Enter the book title first.');const o=$('#bo').value,d=$('#bd').value;if(d<o)return toast('Due date cannot be before the borrow date.');S.ln.push({id:uid(),sid:id,title:t,out:o,due:d,c0:$('#bc').value,ret:null,cond:'',note:'',paid:0});save();toast('Borrowing recorded');R()}
function ret(lid){modal(`<h3>Return book</h3><p>${esc(S.ln.find(l=>l.id==lid).title)}</p><div class="row"><label>Condition on return<select id="rc"><option>Good</option><option>Excellent</option><option>Fair</option><option>Damaged</option><option>Lost</option></select></label><label style="flex:1">Notes<input id="rn" placeholder="e.g. torn cover, missing pages"></label></div><button class="btn" onclick="doRet('${lid}')">Confirm return</button> <button class="btn out" onclick="closeM()">Cancel</button>`)}
function doRet(lid){const l=S.ln.find(x=>x.id==lid);l.ret=today();l.cond=$('#rc').value;l.note=$('#rn').value.trim();save();closeM();toast(late(l)?`Returned. Fine ${money(fine(l))}`:'Returned on time');R()}
function pay(lid){const l=S.ln.find(x=>x.id==lid);modal(`<h3>Record fine payment</h3><p>Balance: <b>${money(bal(l))}</b>${open(l)?' (still growing until the book is returned)':''}</p><div class="row"><label>Amount paid (GH₵)<input id="pa" type="number" step="0.5" value="${bal(l)}"></label></div><button class="btn gold" onclick="doPay('${lid}')">Save payment</button> <button class="btn out" onclick="closeM()">Cancel</button>`)}
function doPay(lid){const a=parseFloat($('#pa').value);if(!(a>0))return toast('Enter an amount above zero.');S.ln.find(x=>x.id==lid).paid=(S.ln.find(x=>x.id==lid).paid||0)+a;save();closeM();toast('Payment saved');R()}
function assign(id){const t=$('#at').value.trim();if(!t)return toast('Enter the assignment title.');S.as.push({id:uid(),sid:id,title:t,due:$('#ad').value,done:false});save();R()}
function togA(id){const a=S.as.find(x=>x.id==id);a.done=!a.done;save();R()}
function moveStu(id){const s=stu(id);modal(`<h3>Update ${esc(s.name)}</h3><div class="row"><label>Class<select id="mk">${clsOpts(s.cls)}</select></label><label>Status<select id="ms"><option value="active">Active</option><option value="left" ${s.status=='left'?'selected':''}>Left the school</option><option value="graduated" ${s.status=='graduated'?'selected':''}>Graduated</option></select></label></div><button class="btn" onclick="doMove('${id}')">Save</button> <button class="btn out" onclick="closeM()">Cancel</button>`)}
function doMove(id){const s=stu(id);s.cls=$('#mk').value;s.status=$('#ms').value;save();closeM();R()}

function libV(){const t=q.toLowerCase();const L=S.ln.filter(l=>(cf!='o'||open(l))&&(cf!='v'||over(l))&&(nm(l.sid)+l.title).toLowerCase().includes(t)).sort((a,b)=>b.out.localeCompare(a.out));
return `<h2>Borrowing &amp; fines</h2><div class="card"><div class="row"><label style="flex:1">Search student or book<input value="${esc(q)}" oninput="q=this.value;R2()"></label><label>Show<select onchange="cf=this.value;R2()"><option value="">All records</option><option value="o" ${cf=='o'?'selected':''}>Currently out</option><option value="v" ${cf=='v'?'selected':''}>Overdue only</option></select></label></div>
<div class="tw"><table><thead><tr><th>Student</th><th>Book</th><th>Due</th><th>Status</th><th>Fine balance</th></tr></thead><tbody>${L.map(l=>`<tr class="r"><td><a class="lk" href="#student-${l.sid}">${esc(nm(l.sid))}</a></td><td>${esc(l.title)}</td><td>${l.due}</td><td>${l.ret?'Returned '+l.ret+' ('+esc(l.cond)+')':over(l)?`<span class="tag bad">${late(l)} days late</span>`:'Out'}</td><td>${money(Math.max(0,bal(l)))}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No borrowing records match.</td></tr>'}</tbody></table></div></div>`}
function R2(){const f=document.activeElement;R();const i=$('input');if(i){i.focus();i.setSelectionRange(1e3,1e3)}}

function admV(){const next=c=>{const n=+c.match(/BS (\d)/)[1];return n>=9?'_grad':(S.cl.find(x=>x.startsWith('BS '+(n+1)))||c)};
return `<h2>Administration</h2><div class="card"><h3>Import class lists from PDF</h3><div class="drop" id="pz" onclick="$('#pf2').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();pick([...event.dataTransfer.files].filter(f=>/pdf$/i.test(f.name)))"><b>Drop the class-list PDFs here</b><br><span class="mut">or tap to choose. Select all 20 at once if you like. The class is read from the file name (for example BS_6_TEASEL.pdf).</span></div><input type="file" id="pf2" accept="application/pdf" multiple hidden onchange="pick([...this.files])"><div id="pq"></div></div>
${DB&&LOC?`<div class="card"><h3>Saved in this browser</h3><p>Records from before the shared database were found in this browser.</p><button class="btn gold" onclick="migrate()">Copy them to the shared database</button></div>`:''}${DB?`<div class="card"><h3>Who can do what</h3><p>Everyone sees the same live records. Accounts with the <b>admin</b> role can change records. Accounts with the <b>monitor</b> role can only look. Create or remove accounts in your Supabase dashboard under Authentication.</p></div>`:''}<div class="card"><h3>New academic year</h3><p class="mut">Current academic year: <b>${S.ay}</b>. Choose where each class moves to. Past borrowing and attendance records are kept.</p><div class="tw"><table>${S.cl.map((c,i)=>`<tr><td>${esc(c)} (${S.st.filter(s=>s.cls==c&&s.status=='active').length})</td><td>→</td><td><select class="ny" data-c="${esc(c)}"><option value="${esc(c)}">Stay in class</option>${S.cl.filter(x=>x!=c).map(x=>`<option value="${esc(x)}" ${x==next(c)?'selected':''}>${esc(x)}</option>`).join('')}<option value="_grad" ${next(c)=='_grad'?'selected':''}>Graduate</option></select></td></tr>`).join('')}</table></div><p><button class="btn" onclick="rollover()">Start new academic year</button></p></div>
<div class="card"><h3>Classes</h3><div class="row"><label>New class name<input id="nc" placeholder="BS 5 Tulip"></label><button class="btn out" onclick="addCl()">Add class</button></div></div>
<div class="card"><h3>${DB?'Backup':'Passwords &amp; backup'}</h3>${DB?'':`<div class="row"><label>Administrator password<input id="pa1" type="password" placeholder="new password"></label><label>Monitor password<input id="pa2" type="password" placeholder="new password"></label><button class="btn out" onclick="pw()">Update passwords</button></div>`}
<button class="btn out" onclick="bk()">Download backup</button> <input type="file" id="rf" accept=".json" hidden onchange="rs(this)"><button class="btn out" onclick="$('#rf').click()">Restore backup</button><p class="mut">Data is saved in this browser. Download a backup regularly and keep it safe.</p></div>`}
let PQ=[];
const cname=f=>{const b=f.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim().toLowerCase();return S.cl.find(c=>c.toLowerCase()==b)||''};
function parseList(t){const o=[];t.split(/\n/).forEach(ln=>{const m=ln.trim().replace(/^\d+\s+(?=[A-Za-z])/,'').match(/^(.+?)\s+(SLJ\d+)\s+(Male|Female)\s+(\+?\d+(?: \d+)*?)(?=\s+20\d\d|\s*$)/i);if(m)o.push({name:m[1].replace(/\s+,/,',').trim(),ref:m[2].toUpperCase(),gender:m[3][0].toUpperCase()+m[3].slice(1).toLowerCase(),contact:m[4]})});return o}
async function pdfText(f){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
for(let p=1;p<=d.numPages;p++){const it=(await(await d.getPage(p)).getTextContent()).items.filter(i=>i.str.trim()).sort((a,b)=>b.transform[5]-a.transform[5]),ls=[];it.forEach(i=>{const l=ls[ls.length-1];if(l&&Math.abs(l.y-i.transform[5])<4)l.a.push(i);else ls.push({y:i.transform[5],a:[i]})});ls.forEach(l=>out+=l.a.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')+'\n')}return out}
async function pick(fs){if(!fs.length)return;if(typeof pdfjsLib=='undefined')return toast('The PDF reader did not load. Check your internet connection and refresh.');PQ=[];$('#pq').innerHTML='<p class="mut">Reading '+fs.length+' file(s)…</p>';
for(const f of fs){let rows=[],err='';try{rows=parseList(await pdfText(f));if(!rows.length)err='No students found'}catch(e){err='Could not read this file'}PQ.push({f:f.name,k:cname(f.name),rows,err})}showPQ()}
function showPQ(){const tot=PQ.reduce((t,p)=>t+p.rows.length,0);$('#pq').innerHTML=PQ.map((p,i)=>{const nw=p.rows.filter(r=>!S.st.some(s=>s.ref==r.ref)).length;return `<div class="card" style="margin-bottom:10px"><b>${esc(p.f)}</b> <span class="tag ${p.rows.length?'ok':'bad'}">${p.err||p.rows.length+' students found'}</span> <span class="mut">${nw} new</span>
<div class="row" style="margin:8px 0"><label>Import into<select onchange="PQ[${i}].k=this.value"><option value="">Choose class…</option>${clsOpts(p.k)}</select></label></div><details><summary class="mut">Preview</summary>${p.rows.slice(0,5).map(r=>esc(r.name)+' · '+esc(r.ref)).join('<br>')}</details></div>`}).join('')+(tot?`<button class="btn gold" onclick="doImp()">Import ${tot} students into the system</button>`:'')}
function doImp(){if(PQ.some(p=>p.rows.length&&!p.k))return toast('Choose a class for every file first.');let n=0,sk=0;PQ.forEach(p=>p.rows.forEach(r=>{if(S.st.some(s=>s.ref==r.ref)){sk++;return}S.st.push({id:uid(),name:r.name,ref:r.ref,gender:r.gender,contact:r.contact,cls:p.k,status:'active',photo:''});n++}));save();PQ=[];$('#pq').innerHTML=`<div class="alert" style="color:var(--g);border-color:var(--g)">${n} students added. ${sk} skipped because they were already listed.</div>`}
function rollover(){if(!confirm('Move every class as selected? Check each destination first.'))return;const mv=[...document.querySelectorAll('.ny')].map(s=>[s.dataset.c,s.value]);const done={};S.st.forEach(s=>{if(s.status!='active')return;const m=mv.find(x=>x[0]==s.cls);if(!m||done[s.id])return;done[s.id]=1;if(m[1]=='_grad')s.status='graduated';else s.cls=m[1]});S.ay=S.ay.split('/').map(n=>+n+1).join('/');save();toast('New academic year started: '+S.ay);R()}
function addCl(){const c=$('#nc').value.trim();if(!c||S.cl.includes(c))return toast('Enter a new class name.');S.cl.push(c);save();R()}
function pw(){const a=$('#pa1').value,m=$('#pa2').value;if(a)S.u.admin=a;if(m)S.u.monitor=m;save();toast('Passwords updated')}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='slj-library-backup-'+today()+'.json';a.click()}
function rs(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);S.gr=S.gr||[];S.ay=S.ay||'2026/2027';S.u=S.u||{};save();toast('Backup restored');R()}catch(e){toast('That file is not a valid backup.')}})}

const pct=g=>g.max?g.score/g.max*100:0,lt=p=>p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':'E',SUBS=['English Language','Mathematics','Integrated Science','Social Studies','RME','Computing','Creative Arts','Ghanaian Language','French','Career Technology','Library'];
const setAT=t=>{AT=t;R()},setTM=t=>{TM=t;R()};
function assV(id){const s=stu(id);if(!s)return'<p>Student not found.</p>';const ed=A(),G=S.gr.filter(g=>g.sid==id&&g.term==TM&&g.ay==S.ay),by=t=>G.filter(g=>g.type==t),av=a=>a.length?a.reduce((t,g)=>t+pct(g),0)/a.length:null,f=v=>v==null?'No records':v.toFixed(1)+'% · '+lt(v);
const C=by('class'),E=by('term'),P=by('project'),dl=`<datalist id="sb">${SUBS.map(x=>`<option>${x}</option>`).join('')}</datalist>`,x=g=>ed?`<button class="btn red sm" onclick="delG('${g.id}')">Delete</button>`:'';
let b='';
if(AT=='class')b=`<div class="tw"><table><thead><tr><th>Subject</th><th>Assessment</th><th>Score</th><th>%</th><th>Grade</th><th>Date</th><th>Comment</th><th></th></tr></thead><tbody>${C.map(g=>`<tr><td>${esc(g.sub)}</td><td>${esc(g.kind)}</td><td>${g.score}/${g.max}</td><td>${pct(g).toFixed(0)}%</td><td><b>${lt(pct(g))}</b></td><td>${esc(g.date)}</td><td>${esc(g.note)}</td><td>${x(g)}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">No class grades for this term yet.</td></tr>'}</tbody></table></div>
${ed?`${dl}<div class="row" style="margin-top:14px"><label>Subject<input id="gs" list="sb"></label><label>Type<select id="gk"><option>Class test</option><option>Quiz</option><option>Homework</option><option>Exercise</option></select></label><label>Score<input id="gx" type="number" style="width:80px"></label><label>Out of<input id="gm" type="number" value="20" style="width:80px"></label><label>Date<input id="gd" type="date" value="${today()}"></label><label style="flex:1">Comment<input id="gn"></label><button class="btn" onclick="addG('${id}')">Add class grade</button></div>`:''}`;
else if(AT=='term')b=`<div class="tw"><table><thead><tr><th>Subject</th><th>Class score /30</th><th>Exam /70</th><th>Total</th><th>Grade</th><th>Performance</th><th>Remark</th><th></th></tr></thead><tbody>${E.map(g=>`<tr><td>${esc(g.sub)}</td><td>${g.cs}</td><td>${g.ex}</td><td><b>${g.score}</b></td><td><b>${lt(g.score)}</b></td><td><div class="bar"><i style="width:${g.score}%"></i></div></td><td>${esc(g.note)}</td><td>${x(g)}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">No end-of-term results yet.</td></tr>'}</tbody></table></div>
${ed?`${dl}<div class="row" style="margin-top:14px"><label>Subject<input id="gs" list="sb"></label><label>Class score /30<input id="gc" type="number" style="width:100px"></label><label>Exam /70<input id="ge" type="number" style="width:100px"></label><label style="flex:1">Teacher's remark<input id="gn"></label><button class="btn" onclick="addG('${id}')">Add term result</button></div>`:''}`;
else b=`<div class="tw"><table><thead><tr><th>Project</th><th>Subject</th><th>Status</th><th>Score</th><th>Grade</th><th>Comment</th><th></th></tr></thead><tbody>${P.map(g=>`<tr><td>${esc(g.sub)}</td><td>${esc(g.subj)}</td><td><span class="tag ${g.status=='Graded'?'ok':''}">${esc(g.status)}</span></td><td>${g.status=='Graded'?g.score+'/'+g.max:'–'}</td><td><b>${g.status=='Graded'?lt(pct(g)):'–'}</b></td><td>${esc(g.note)}</td><td>${x(g)}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">No projects recorded this term.</td></tr>'}</tbody></table></div>
${ed?`${dl}<div class="row" style="margin-top:14px"><label>Project title<input id="gs"></label><label>Subject<input id="gj" list="sb"></label><label>Status<select id="gk"><option>In progress</option><option>Submitted</option><option>Graded</option></select></label><label>Score<input id="gx" type="number" style="width:80px"></label><label>Out of<input id="gm" type="number" value="100" style="width:80px"></label><label style="flex:1">Comment<input id="gn"></label><button class="btn" onclick="addG('${id}')">Add project</button></div>`:''}`;
const pj=P.filter(g=>g.status=='Graded');
return `<p><a class="lk" href="#student-${id}">← ${esc(s.name)}</a></p><h2>Assessment &amp; performance</h2><div class="card"><div class="row"><b class="serif" style="font-size:22px;flex:1">${esc(s.name)} <span class="mut" style="font-size:14px;font-family:Inter">${esc(s.cls)} · ${S.ay}</span></b><div class="tabs" style="margin:0">${['Term 1','Term 2','Term 3'].map(t=>`<button class="btn ${t==TM?'gold':'out'} sm" onclick="setTM('${t}')">${t}</button>`).join('')}</div></div>
<div class="stats" style="margin:0"><div class="stat"><b style="font-size:24px">${f(av(C))}</b><span>Class grades average</span></div><div class="stat"><b style="font-size:24px">${f(av(E))}</b><span>End of term average</span></div><div class="stat"><b style="font-size:24px">${f(av(pj))}</b><span>Graded projects average</span></div></div></div>
<div class="card"><div class="tabs">${[['class','Class grades'],['term','End of term'],['project','Projects']].map(t=>`<button class="btn ${AT==t[0]?'':'out'}" onclick="setAT('${t[0]}')">${t[1]}</button>`).join('')}</div>${b}<p class="mut" style="margin-top:12px">Grades: A 80+, B 70–79, C 60–69, D 50–59, E below 50.</p></div>`}
function addG(id){const t=AT,v=k=>($('#'+k)?.value||'').trim(),sub=v('gs');if(!sub)return toast('Enter the subject or project title.');const g={id:uid(),sid:id,type:t,term:TM,ay:S.ay,sub,note:v('gn')};
if(t=='class'){g.kind=v('gk');g.score=parseFloat(v('gx'));g.max=parseFloat(v('gm'))||100;g.date=v('gd');if(isNaN(g.score)||g.score<0||g.score>g.max)return toast('Enter a score between 0 and the total.')}
else if(t=='term'){g.cs=parseFloat(v('gc'))||0;g.ex=parseFloat(v('ge'))||0;if(g.cs>30||g.ex>70||g.cs<0||g.ex<0)return toast('Class score is out of 30 and exam score is out of 70.');g.score=g.cs+g.ex;g.max=100}
else{g.subj=v('gj');g.status=v('gk');g.score=parseFloat(v('gx'))||0;g.max=parseFloat(v('gm'))||100;if(g.status=='Graded'&&g.score>g.max)return toast('Score cannot be more than the total.')}
S.gr.push(g);save();toast('Saved');R()}
function delG(id){if(!confirm('Delete this record?'))return;S.gr=S.gr.filter(g=>g.id!=id);save();R()}
boot();
</script></body></html>
